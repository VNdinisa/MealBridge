[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mealbridge"
version = "0.1.0"
description = "Voice-driven care dispatch and meal coordination for homebound older adults."
readme = "CLAUDE.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
