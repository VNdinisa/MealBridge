[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mealbridge"
version = "0.1.0"
description = "Voice-driven care dispatch and meal coordination for homebound older adults."
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.1",
    "openai>=1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
